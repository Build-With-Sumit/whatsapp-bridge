<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Globus WhatsApp bridge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
           font-size: 13px; color: #2a1a08; background: #fff7f0; margin: 0;
           padding: 14px 16px; width: 320px; }
    h2 { margin: 0 0 .3rem; font-size: 15px; }
    .muted { color: #7a655a; font-size: 12px; }
    .row { display: flex; justify-content: space-between; margin: .35rem 0; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 600; }
    .pill.ok { background: #d6f0c8; color: #1f5a0a; }
    .pill.warn { background: #ffe2a8; color: #8a5a00; }
    .pill.err { background: #ffd0d0; color: #8a1a1a; }
    textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace,
               Menlo, monospace; font-size: 11px; padding: 6px 8px;
               border: 1px solid #e2d4c4; border-radius: 6px; resize: vertical; }
    button { background: #c7714b; color: #fff; border: 0; border-radius: 6px;
             padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
             margin-top: 6px; }
    button.ghost { background: #fff; color: #c7714b; border: 1px solid #c7714b; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .err { color: #8a1a1a; font-size: 11px; margin-top: .3rem; }
    hr { border: 0; border-top: 1px solid #ead8c4; margin: 12px 0; }
    a { color: #c7714b; }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <img src="icons/icon-48.png" width="34" height="34" alt="Build With Sumit">
    <div>
      <div style="font-weight:700;font-size:14px;line-height:1.2">Build With <span style="color:#c7714b">Sumit</span></div>
      <div class="muted" style="font-size:11px;letter-spacing:.04em;text-transform:uppercase">Globus · WhatsApp bridge</div>
    </div>
  </div>
  <div class="muted">Read-only Phase 1A. Sends messages to your Globus vault.</div>

  <hr>

  <div class="row"><strong>Status</strong> <span id="statusPill" class="pill warn">checking…</span></div>
  <div class="row muted"><span>Member</span><span id="memberLine">—</span></div>
  <div class="row muted"><span>Queued in browser</span><span id="queuedLine">—</span></div>
  <div class="row muted"><span>Uploaded this session</span><span id="sentLine">—</span></div>
  <div class="row muted"><span>Last upload</span><span id="lastLine">—</span></div>
  <div class="err" id="errLine"></div>

  <hr>

  <div><strong>Pairing token</strong></div>
  <div class="muted" style="margin: .3rem 0 .4rem">
    Get yours at <a href="https://buildwithsumit.com/members/whatsapp" target="_blank">buildwithsumit.com/members/whatsapp</a>
    and paste here.
  </div>
  <textarea id="tokenInput" rows="3" placeholder="paste your Globus WhatsApp token here"></textarea>
  <button id="saveBtn">Save token</button>
  <button id="flushBtn" class="ghost">Flush now</button>

  <script src="popup.js"></script>
</body>
</html>
